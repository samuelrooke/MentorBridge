<!--
  The account form, used on the student, mentor and company pages. It creates a MentorBridge
  account through POST /api/signup (server/src/routes/signup.js) and then logs the person in on
  the platform (/auth/confirm), where they answer the short profile questions for matching.
  The page's segment fills in the role. main.js shows only the fields for that role
  (data-for-role) and disables the rest, so hidden fields are neither checked nor sent.
-->
<div class="form-card" id="signup-panel">
  <form id="signup-form" class="flex flex-col gap-5" novalidate>
    <input type="hidden" name="role" value="{{segment}}" />

    <div class="grid gap-5 sm:grid-cols-2">
      <div class="field">
        <label for="first_name">First name</label>
        <input id="first_name" name="first_name" type="text" required maxlength="60" autocomplete="given-name" />
      </div>
      <div class="field">
        <label for="last_name">Surname</label>
        <input id="last_name" name="last_name" type="text" required maxlength="60" autocomplete="family-name" />
      </div>
    </div>

    <div class="field" data-for-role="company">
      <label for="company">Company name</label>
      <input id="company" name="company" type="text" required maxlength="200" autocomplete="organization" />
    </div>

    <div class="field">
      <label for="email">
        <span data-for-role="company">Work email</span><span data-for-role="student mentor">Email</span>
      </label>
      <input id="email" name="email" type="email" required maxlength="254" autocomplete="email" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="password-input">
        <input id="password" name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password" aria-describedby="password-hint" />
        <button type="button" class="password-toggle" data-password-toggle aria-pressed="false">Show</button>
      </div>
      <p id="password-hint" class="text-sm text-muted">At least 8 characters.</p>
    </div>

    <!-- Honeypot: hidden from people, bots fill it in. -->
    <div class="honeypot" aria-hidden="true">
      <label for="website">Leave this field empty</label>
      <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
    </div>

    <p id="form-error" class="form-error" role="alert" hidden></p>

    <button type="submit" class="btn btn-primary btn-lg w-full">Create free account</button>
    <p class="text-sm text-muted">
      Free in the first version. How we handle your details: <a href="/privacy/">privacy statement</a>.
      Already have an account? <a href="/login" data-app-login>Log in</a>.
    </p>
  </form>
</div>
