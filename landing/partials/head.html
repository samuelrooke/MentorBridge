<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2E1015" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://mentorbridge.nl{{path}}" vite-ignore />
    <link rel="alternate" hreflang="en" href="{{path}}" vite-ignore />
    <link rel="alternate" hreflang="nl" href="/nl{{path}}" vite-ignore />
    <link rel="alternate" hreflang="x-default" href="{{path}}" vite-ignore />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&display=swap"
    />
    <!-- Send visitors who picked Dutch before to the Dutch version of this page. -->
    <script>try{if(document.documentElement.lang==='en'&&localStorage.getItem('mb-lang')==='nl')location.replace('/nl'+location.pathname+location.search+location.hash)}catch(e){}</script>
    <script>document.documentElement.classList.add('js')</script>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.js"></script>
    <!-- GoatCounter: cookieless visitor counting, dashboard at https://mentorbridge.goatcounter.com -->
    <script data-goatcounter="https://mentorbridge.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
