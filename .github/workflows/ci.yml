# Lint, test and build on every push and pull request.
name: CI

on:
  push:
    branches: [main, devel]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          docker build -f server/Dockerfile -t mentorbridge-api .
          docker build -f landing/Dockerfile -t mentorbridge-landing .
          docker build -f client/Dockerfile -t mentorbridge-client .
