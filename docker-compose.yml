# Runs the whole MentorBridge stack in Docker:
#   API           http://localhost:4000
#   Platform app  http://localhost:8080
#   Landing page  http://localhost:8081
#
# Usage: docker compose up --build
# Reads secrets from server/.env and client/.env (create them with `npm run setup`).
services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: server/.env
    environment:
      # Development mode, so CORS also allows the local platform app and landing page.
      NODE_ENV: development
      PORT: 4000
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - '8080:80'
    depends_on:
      - api

  landing:
    build:
      context: .
      dockerfile: landing/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - '8081:80'
    depends_on:
      - api
