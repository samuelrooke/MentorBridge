# Serves a built Vite app. Unknown paths fall back to index.html,
# so client-side routes like /dashboard work on reload.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
